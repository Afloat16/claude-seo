name: SERP overlap contribution validation

on:
  push:
    branches: ["validation/20261126-serp-overlap"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out validation driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact contribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a2862949ca2c53b2242d5d70051daf5c09ce00a1
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install declared HTTP and HTML dependencies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines = Path("candidate/requirements.txt").read_text().splitlines()
          needed = [line for line in lines if re.match(r"^(beautifulsoup4|requests|idna|lxml|urllib3)\b", line.strip())]
          assert len(needed) >= 3, needed
          Path("live-requirements.txt").write_text("\n".join(needed) + "\n")
          PY
          python -m pip install -r live-requirements.txt pytest
      - name: Run calculator and integration regressions
        working-directory: candidate
        run: python -m pytest -q tests/test_serp_overlap.py tests/test_runtime.py tests/test_manifest_consistency.py tests/test_audit_instructions.py tests/test_consistency_check.py
      - name: Verify observed URL inputs and actual public HTTPS responses
        run: python .github/contribution-smoke/serp.py --repo-root candidate --expected-sha a2862949ca2c53b2242d5d70051daf5c09ce00a1 --input .github/contribution-smoke/serp-input.json
