name: Reservation schema contribution validation

on:
  push:
    branches: ["validation/20261126-reservation-schema"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out validation driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact contribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8f37a560a2b091b91ce6e3d0dcf4a6d47dde34c5
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install declared HTTP and HTML dependencies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines = Path("candidate/requirements.txt").read_text().splitlines()
          needed = [line for line in lines if re.match(r"^(beautifulsoup4|requests|idna|lxml|urllib3)\b", line.strip())]
          assert len(needed) >= 3, needed
          Path("live-requirements.txt").write_text("\n".join(needed) + "\n")
          PY
          python -m pip install -r live-requirements.txt pytest
      - name: Run schema regressions
        working-directory: candidate
        run: python -m pytest -q --basetemp=../pytest-reservation tests/test_schema_reservation_types.py tests/test_schema_v2.py
      - name: Verify the live Schema.org lodging example with the exact contribution
        run: python .github/contribution-smoke/reservation.py --repo-root candidate --expected-sha 8f37a560a2b091b91ce6e3d0dcf4a6d47dde34c5
