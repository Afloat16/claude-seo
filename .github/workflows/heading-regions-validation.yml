name: Heading region contribution validation

on:
  push:
    branches: ["validation/20262766-heading-regions"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out validation driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact contribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 66cc042b51c18f96a8258637599a6cad7909013b
          path: candidate
          persist-credentials: false
      - name: Check out unchanged upstream baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5d7d85ef32ade08dd4265cb678af8357ca6e6098
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install declared HTTP and HTML dependencies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines = Path("candidate/requirements.txt").read_text().splitlines()
          needed = [line for line in lines if re.match(r"^(beautifulsoup4|requests|idna|lxml|urllib3)\b", line.strip())]
          assert len(needed) == 5, needed
          Path("live-requirements.txt").write_text("\n".join(needed) + "\n")
          PY
          python -m pip install -r live-requirements.txt pytest
      - name: Reproduce baseline heading-region failures
        shell: bash
        run: |
          python - <<'PY'
          import json
          import shutil
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          test = "tests/test_page_heading_regions.py"
          tested_sha = subprocess.check_output(["git", "-C", "baseline", "rev-parse", "HEAD"], text=True).strip()
          assert tested_sha == "5d7d85ef32ade08dd4265cb678af8357ca6e6098", tested_sha
          shutil.copyfile(Path("candidate") / test, Path("baseline") / test)
          result = subprocess.run([sys.executable, "-m", "pytest", "-q", test,
                                   "--basetemp=../pytest-heading-base", "--junitxml=../heading-base.xml"], cwd="baseline")
          cases = ET.parse("heading-base.xml").findall(".//testcase")
          failed = [case.attrib["name"] for case in cases if case.find("failure") is not None]
          errors = [case for case in cases if case.find("error") is not None]
          skipped = [case for case in cases if case.find("skipped") is not None]
          assert result.returncode == 1 and len(cases) == 24, (result.returncode, len(cases))
          assert len(failed) == 20 and not errors and not skipped, (failed, errors, skipped)
          print("BASELINE_HEADING_EVIDENCE " + json.dumps({"tested_sha": tested_sha,
                "tests": len(cases), "failures": len(failed), "passes": len(cases) - len(failed),
                "errors": 0, "skips": 0}))
          PY
      - name: Require all 276 related candidate tests with no skips
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          tested_sha = subprocess.check_output(["git", "-C", "candidate", "rev-parse", "HEAD"], text=True).strip()
          assert tested_sha == "66cc042b51c18f96a8258637599a6cad7909013b", tested_sha
          tests = ["tests/test_page_heading_regions.py", "tests/test_page_checks.py",
                   "tests/test_page_checks_mixed_base.py", "tests/test_jsonld_constants.py"]
          result = subprocess.run([sys.executable, "-m", "pytest", "-q", *tests,
                                   "--basetemp=../pytest-heading-candidate", "--junitxml=../heading-candidate.xml"],
                                  cwd="candidate")
          cases = ET.parse("heading-candidate.xml").findall(".//testcase")
          failed = [case for case in cases if case.find("failure") is not None or case.find("error") is not None]
          skipped = [case for case in cases if case.find("skipped") is not None]
          assert result.returncode == 0 and len(cases) == 276, (result.returncode, len(cases))
          assert not failed and not skipped, (failed, skipped)
          print("CANDIDATE_HEADING_EVIDENCE " + json.dumps({"tested_sha": tested_sha,
                "tests": len(cases), "passes": len(cases), "errors": 0, "skips": 0}))
          PY
      - name: Check actual Python tutorial heading facts through API and URL CLI
        run: python .github/contribution-smoke/heading-regions.py --repo-root candidate --expected-sha 66cc042b51c18f96a8258637599a6cad7909013b
